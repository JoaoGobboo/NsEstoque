<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
</head>
<body>
    <section id="products-section">
    <div class="section-header">
        <h2>Produtos</h2>
        <div class="section-buttons">
            <button id="manage-users">Gerenciar Usuários</button>
            <button id="add-product">Cadastrar Produto</button>
        </div>
    </div>

    <table id="products-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Categoria</th>
                <th>Quantidade</th>
                <th>Preço Compra</th>
                <th>Preço Venda</th>
                <th>Descrição</th>
                <th>Data Criação</th>
                <th>Data Atualização</th>
                <th>Editar</th>
                <th>Excluir</th>
            </tr>
        </thead>
        <tbody>
            <!-- Linhas dos produtos serão inseridas via JS -->
        </tbody>
    </table>
</section>

<!-- Modal de cadastro -->
<div id="product-modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Cadastrar Produto</h2>
        <form id="product-form">
            <label>Nome:</label>
            <input type="text" name="nome" required>
            
            <label>Categoria:</label>
            <input type="text" name="categoria" required>
            
            <label>Quantidade:</label>
            <input type="number" name="quantidade" required>
            
            <label>Preço Compra:</label>
            <input type="number" step="0.01" name="preco_compra" required>
            
            <label>Preço Venda:</label>
            <input type="number" step="0.01" name="preco_venda" required>
            
            <label>Descrição:</label>
            <textarea name="descricao"></textarea>
            
            <button type="submit">Cadastrar</button>
        </form>
    </div>
</div>
</body>
</html>

<style>
    /* Modal */
    .modal {
        display: none; /* Oculto por padrão */
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
        background-color: #fefefe;
        margin: 50px auto;
        padding: 20px;
        border-radius: 8px;
        width: 400px;
        position: relative;
    }

    .modal-content h2 {
        margin-top: 0;
    }

    .close {
        color: #aaa;
        position: absolute;
        right: 10px;
        top: 10px;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }

    .close:hover {
        color: black;
    }

    #product-form input, #product-form textarea {
        width: 100%;
        padding: 8px;
        margin: 5px 0 15px 0;
        border-radius: 4px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }

    #product-form button {
        width: 100%;
        padding: 10px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
    }

    #product-form button:hover {
        background-color: #45a049;
    }
</style>
